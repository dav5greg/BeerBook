name: One-time cleanup grg

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'temporary grg cleanup endpoint')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Wait for Vercel deployment
        run: sleep 90
      - name: Delete grg account
        run: |
          curl --fail-with-body -X POST https://beer-book-api.vercel.app/api/maintenance/cleanup-grg-7f4c9d2e
      - name: Remove temporary endpoint and workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f backend/api/maintenance/cleanup-grg-7f4c9d2e.js .github/workflows/cleanup-grg-once.yml
          git add -A
          git commit -m "chore: remove temporary grg cleanup"
          git push
