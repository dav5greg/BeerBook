name: Fix form toggle selection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply toggle behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          old_carbonation = "onClick={() => update('carbonation', x)}"
          new_carbonation = "onClick={() => update('carbonation', form.carbonation === x ? '' : x)}"
          old_rating = "onClick={() => update('rating', x)}"
          new_rating = "onClick={() => update('rating', Number(form.rating) === x ? 0 : x)}"
          assert old_carbonation in s, 'carbonation handler not found'
          assert old_rating in s, 'rating handler not found'
          s = s.replace(old_carbonation, new_carbonation, 1)
          s = s.replace(old_rating, new_rating, 1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-toggle-selection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx .github/workflows/fix-toggle-selection.yml
          git commit -m 'Allow clearing selected carbonation and rating'
          git push
