name: Verify Beer Book user

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check grg data
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H 'x-user-key: grg' 'https://beer-book-api.vercel.app/api/beers')"
          echo "$response" | jq '{beer_count: (.beers | length), beers: [.beers[] | {name, brewery, rating, place_names}]}' > verify-result.json
          cat verify-result.json
      - name: Upload verification result
        uses: actions/upload-artifact@v4
        with:
          name: verify-grg-result
          path: verify-result.json
