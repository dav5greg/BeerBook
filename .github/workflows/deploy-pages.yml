name: Deploy Beer Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Apply library UI and save optimizations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main.jsx')
          s = p.read_text()
          start = s.index('function BeerRow({ beer, onClick, onDelete })')
          end = s.index('\nfunction Detail', start)
          block = s[start:end]
          if 'beer-to-try-icon' not in block:
              block, count = re.subn(r'(\n\s*</button>)(\n\s*<button className="delete-beer")', r'\1\n    {beer.to_try && <span className="beer-to-try-icon" aria-label="Da provare" title="Da provare">🔖</span>}\2', block, count=1)
              if count != 1:
                  raise SystemExit('BeerRow insertion failed')
              s = s[:start] + block + s[end:]

          old = "await loadBeers()\n      navigate('library')"
          new = "const data = await res.json().catch(() => ({}))\n      const savedBeer = { ...payload, id: selected ? selected.id : data.id, places: payload.places }\n      setBeers(current => selected ? current.map(beer => beer.id === selected.id ? { ...beer, ...savedBeer } : beer) : [savedBeer, ...current])\n      navigate('library')"
          if old in s and 'const savedBeer = { ...payload' not in s:
              s = s.replace(old, new, 1)

          p.write_text(s)

          p = Path('src/styles.css')
          s = p.read_text()
          if '.beer-to-try-icon{' not in s:
              s += "\n.beer-row{position:relative;}\n.beer-to-try-icon{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:2;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(255,250,243,.96);border:1px solid var(--line);box-shadow:0 3px 9px rgba(77,45,25,.10);font-size:15px;line-height:1;pointer-events:none;}\n"
              p.write_text(s)
          PY
      - name: Build
        env:
          VITE_API_BASE: https://beer-book-api.vercel.app
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
