name: Deploy Beer Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Apply library UI and save optimizations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main.jsx')
          s = p.read_text()
          start = s.index('function Home({')
          end = s.index('\nfunction Stat', start)
          block = s[start:end]
          block = re.sub(r'const recent = beers\.slice\(0, 3\)', 'const recent = beers.filter(b => !b.to_try).slice(0, 3)', block, count=1)
          s = s[:start] + block + s[end:]

          start = s.index('function BeerRow({ beer, onClick, onDelete })')
          end = s.index('\nfunction Detail', start)
          block = s[start:end]
          block = re.sub(r'\n\s*\{beer\.to_try && <span className="beer-to-try-icon"[^>]*>🔖</span>\}', '', block)
          target = '<strong>{beer.name}</strong>'
          replacement = '<strong>{beer.to_try && <span className="beer-to-try-icon" aria-label="Da provare" title="Da provare">🔖</span>}{beer.name}</strong>'
          if target not in block:
              raise SystemExit('BeerRow name line not found')
          block = block.replace(target, replacement, 1)
          s = s[:start] + block + s[end:]

          old = "await loadBeers()\n      navigate('library')"
          new = "const data = await res.json().catch(() => ({}))\n      const savedBeer = { ...payload, id: selected ? selected.id : data.id, places: payload.places }\n      setBeers(current => selected ? current.map(beer => beer.id === selected.id ? { ...beer, ...savedBeer } : beer) : [savedBeer, ...current])\n      navigate('library')"
          if old in s and 'const savedBeer = { ...payload' not in s:
              s = s.replace(old, new, 1)

          p.write_text(s)

          p = Path('src/styles.css')
          s = p.read_text()
          extra = """
          .beer-row-main{padding:2px 2px;gap:10px}
          .beer-list-art{width:50px;height:62px}
          .library-list .beer-info strong{display:flex;align-items:center;gap:5px}
          .beer-to-try-icon{display:inline-grid;place-items:center;flex:0 0 auto;width:18px;height:18px;margin-right:0;border-radius:50%;background:rgba(255,250,243,.96);border:1px solid var(--line);box-shadow:0 2px 5px rgba(77,45,25,.10);font-size:11px;line-height:1}
          """
          if '.beer-to-try-icon{' in s:
              s = re.sub(r'\.beer-row\{position:relative;\}\.beer-to-try-icon\{[^}]*\}\s*', '', s)
          s += '\n' + extra
          p.write_text(s)
          PY
      - name: Build
        env:
          VITE_API_BASE: https://beer-book-api.vercel.app
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
